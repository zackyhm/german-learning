   pic(w)+(flipped?'<span class="vk-ar">'+esc(w.r)+'</span>':'<span class="vk-art">'+esc(w.a||w.c||'')+'</span><span class="vk-de" dir="ltr">'+esc(w.d)+'</span>')+
   '<span class="vk-hint">'+(flipped?'اضغط للرجوع':'اضغط لرؤية المعنى')+'</span></button>'+
   '<div class="vk-row">'+'<button type="button" class="vk-btn ghost" data-act="speak">استمع</button>'+
   '<button type="button" class="vk-btn bad" data-act="again">لم أحفظها</button><button type="button" class="vk-btn good" data-act="known">حفظتها</button></div>';
}
function viewGame(){
  if(nounPool().length<3)return '<div class="vk-empty"><b>هذا الاختيار فيه أسماء قليلة.</b><span>اختر "كل الدروس" لتلعب.</span></div>';
  if(!game)newGame();
  if(game.i>=game.q.length){
    var h='<div class="vk-end"><b>النتيجة: '+game.score+' من '+game.q.length+'</b><span>أفضل سلسلة صحيحة: '+st.best+'</span></div>';
    if(game.wrong.length){h+='<h3>راجع هذه الكلمات</h3><div class="vk-list">'+game.wrong.map(function(w){return '<div class="vk-li '+G[w.a]+'"><b dir="ltr">'+esc(full(w))+'</b><small>'+esc(w.r)+'</small></div>'}).join('')+'</div>'}
    return h+'<div class="vk-row"><button type="button" class="vk-btn good" data-act="newgame">جولة جديدة</button></div>';
  }
  var w=game.q[game.i],a=game.ans;
  var b=['der','die','das'].map(function(x){
    var c='vk-art-btn '+G[x];if(a!==null){if(x===w.a)c+=' right';else if(x===a)c+=' wrong'}
    return '<button type="button" class="'+c+'" data-art="'+x+'"'+(a!==null?' disabled':'')+'>'+x+'</button>'}).join('');
  var fb=a===null?'':(a===w.a?'<p class="vk-fb ok">صحيح: '+esc(full(w))+'</p>':'<p class="vk-fb no">الجواب: '+esc(full(w))+'</p>');
  return '<div class="vk-count">السؤال '+(game.i+1)+' من '+game.q.length+' · سلسلة: '+game.streak+'</div>'+
   '<div class="vk-q">'+pic(w)+'<span class="vk-ar">'+esc(w.r)+'</span><span class="vk-de" dir="ltr"><i>?</i> '+esc(w.d)+'</span></div>'+
   '<div class="vk-arts">'+b+'</div>'+fb+
   (a!==null?'<div class="vk-row"><button type="button" class="vk-btn good" data-act="next">التالي</button></div>':'');
}
function viewMatch(){
  if(pool().length<2)return '<div class="vk-empty"><b>هذا الاختيار فيه كلمات قليلة.</b></div>';
  if(!match)newMatch();
  var m=match,total=m.p.length;
  function cell(side,i){
    var w=m.p[i],isDone=m.done.indexOf(i)>-1,c='vk-cell';
    if(isDone)c+=' done';
    if(m.sel&&m.sel.side===side&&m.sel.i===i)c+=' sel';
    if(m.bad&&((m.bad.a.side===side&&m.bad.a.i===i)||(m.bad.b.side===side&&m.bad.b.i===i)))c+=' bad';
    return '<button type="button" class="'+c+(side==='l'?' de':'')+'" data-side="'+side+'" data-i="'+i+'"'+(isDone?' disabled':'')+(side==='l'?' dir="ltr"':'')+'>'+esc(side==='l'?full(w):w.r)+'</button>'}
  var h='<div class="vk-count">محاولات: '+m.moves+' · مطابقة: '+m.done.length+' من '+total+'</div><div class="vk-board"><div>'+m.L.map(function(i){return cell('l',i)}).join('')+'</div><div>'+m.R.map(function(i){return cell('r',i)}).join('')+'</div></div>';
  if(m.done.length===total){if(!m.end)m.end=Math.round((Date.now()-m.t0)/1000);h+='<div class="vk-end"><b>أحسنت. أنهيتها في '+m.end+' ثانية</b><span>'+m.moves+' محاولة</span></div><div class="vk-row"><button type="button" class="vk-btn good" data-act="newmatch">جولة جديدة</button></div>'}
  return h;
}

function opts4(w,list){var o=shuffle(list.filter(function(x){return x!==w&&full(x)!==full(w)})).slice(0,3);o.push(w);return shuffle(o)}
function newDuel(){
  var all=pool(),nn=nounPool(),pw=all.filter(function(w){return w.a&&w.e&&!w.n&&!w.p});
  var q=[],i,N=12;
  for(i=0;i<N;i++){
    var useWhat=pw.length>=4&&(nn.length<3||Math.random()<.5);
    if(useWhat){var w=pw[Math.floor(Math.random()*pw.length)];q.push({t:'what',w:w,o:opts4(w,pw)})}
    else if(nn.length>=3){q.push({t:'art',w:nn[Math.floor(Math.random()*nn.length)]})}
  }
  duel={q:q,i:0,turn:0,s:[0,0],ans:null}
}
function viewDuel(){
  if(pool().length<4)return '<div class="vk-empty"><b>هذا الاختيار فيه كلمات قليلة.</b><span>اختر "كل الدروس".</span></div>';
  if(!duel)newDuel();
  var d=duel,names=['اللاعب 1','اللاعب 2'];
  var board='<div class="vk-vs"><div class="vk-p p0'+(d.turn===0&&d.i<d.q.length?' on':'')+'"><span>'+names[0]+'</span><b>'+d.s[0]+'</b></div><div class="vk-p p1'+(d.turn===1&&d.i<d.q.length?' on':'')+'"><span>'+names[1]+'</span><b>'+d.s[1]+'</b></div></div>';
  if(d.i>=d.q.length){
    var r=d.s[0]===d.s[1]?'تعادل!':'الفائز: '+(d.s[0]>d.s[1]?names[0]:names[1]);
    return board+'<div class="vk-end"><b>'+r+'</b><span>'+d.s[0]+' – '+d.s[1]+'</span></div><div class="vk-row"><button type="button" class="vk-btn good" data-act="newduel">جولة جديدة</button></div>'}
  var Q=d.q[d.i],w=Q.w,a=d.ans,body;
  var who='<div class="vk-count">السؤال '+(d.i+1)+' من '+d.q.length+' · دور <b class="p'+d.turn+'">'+names[d.turn]+'</b></div>';
  if(Q.t==='art'){
    var b=['der','die','das'].map(function(x){
      var c='vk-art-btn '+G[x];if(a!==null){if(x===w.a)c+=' right';else if(x===a)c+=' wrong'}
      return '<button type="button" class="'+c+'" data-dart="'+x+'"'+(a!==null?' disabled':'')+'>'+x+'</button>'}).join('');
    body='<div class="vk-q"><span class="vk-art">der · die · das ؟</span>'+pic(w)+'<span class="vk-ar">'+esc(w.r)+'</span><span class="vk-de" dir="ltr"><i>?</i> '+esc(w.d)+'</span></div><div class="vk-arts">'+b+'</div>';
  }else{
    var ob=Q.o.map(function(x,ix){
      var c='vk-opt';if(a!==null){if(x===w)c+=' right';else if(ix===a)c+=' wrong'}
      return '<button type="button" class="'+c+'" dir="ltr" data-dopt="'+ix+'"'+(a!==null?' disabled':'')+'>'+esc(full(x))+'</button>'}).join('');
    body='<div class="vk-q"><span class="vk-art">ما هذا؟ · Was ist das?</span>'+pic(w)+'</div><div class="vk-opts">'+ob+'</div>';
  }
  var ok=a!==null&&(Q.t==='art'?a===w.a:Q.o[a]===w);
  var fb=a===null?'':(ok?'<p class="vk-fb ok">صحيح! +1 · '+esc(full(w))+' = '+esc(w.r)+'</p>':'<p class="vk-fb no">الجواب: '+esc(full(w))+' = '+esc(w.r)+'</p>');
  return board+who+body+fb+(a!==null?'<div class="vk-row"><button type="button" class="vk-btn good" data-act="dnext">التالي</button></div>':'');
}
function dAnswer(val){
  var d=duel,Q=d.q[d.i];if(!d||d.ans!==null||!Q)return;
  d.ans=val;var ok=Q.t==='art'?val===Q.w.a:Q.o[val]===Q.w;
  if(ok)d.s[d.turn]++;speak(full(Q.w));fx=ok?'ok':'no';render()
}
function render(){root.innerHTML=header()+(voiceNote?NOTE:'')+'<div class="vk-body'+(fx?' fx-'+fx:'')+'">'+(mode==='cards'?viewCards():mode==='game'?viewGame():mode==='duel'?viewDuel():viewMatch())+'</div>';fx='';hydrate()}
function next(){cur=queue[0]||null;flipped=false;fx='in';render()}

root.addEventListener('change',function(e){
  if(e.target.id==='vkLesson'){lesson=+e.target.value;buildQueue();game=null;match=null;duel=null;render()}
});
root.addEventListener('click',function(e){
  var t=e.target.closest('[data-mode],[data-act],[data-art],[data-side],[data-dart],[data-dopt]');if(!t)return;
  if(t.dataset.mode){mode=t.dataset.mode;fx='in';render();return}
  if(t.dataset.dart){dAnswer(t.dataset.dart);return}
  if(t.dataset.dopt){dAnswer(+t.dataset.dopt);return}
  if(t.dataset.art){
    if(!game||game.ans!==null)return;var w=game.q[game.i];game.ans=t.dataset.art;speak(full(w));
    if(game.ans===w.a){game.score++;game.streak++;if(game.streak>st.best){st.best=game.streak;save()}}else{game.streak=0;game.wrong.push(w)}
    fx=game.ans===w.a?'ok':'no';render();return}
  if(t.dataset.side){
    if(lock||!match)return;var side=t.dataset.side,i=+t.dataset.i,m=match;
    if(m.done.indexOf(i)>-1)return;
    if(!m.sel||m.sel.side===side){m.sel={side:side,i:i};render();return}
    m.moves++;
    if(m.sel.i===i){m.done.push(i);m.sel=null;fx='ok';render()}
    else{m.bad={a:m.sel,b:{side:side,i:i}};lock=true;fx='no';render();setTimeout(function(){m.bad=null;m.sel=null;lock=false;render()},600)}
    return}
  var a=t.dataset.act;
  if(a==='flip'){flipped=!flipped;fx='flip';render()}
  else if(a==='speak'){if(cur)speak(full(cur))}
  else if(a==='known'&&cur){var k=key(cur);st.boxes[k]=2;save();queue.shift();next()}
  else if(a==='again'&&cur){st.boxes[key(cur)]=0;save();queue.shift();queue.splice(Math.min(3,queue.length),0,cur);next()}
  else if(a==='restart'){pool().forEach(function(w){delete st.boxes[key(w)]});save();buildQueue();render()}
  else if(a==='reset'){if(window.confirm('مسح كل تقدمك في المفردات؟')){st.boxes={};save();buildQueue();render()}}
  else if(a==='newgame'){newGame();fx='in';render()}
  else if(a==='next'){game.i++;game.ans=null;fx='in';render()}
  else if(a==='dnext'){duel.i++;duel.turn=1-duel.turn;duel.ans=null;fx='in';render()}
  else if(a==='newduel'){newDuel();fx='in';render()}
  else if(a==='newmatch'){newMatch();fx='in';render()}
});
buildQueue();render();
})();
</script>
</body>
</html>
